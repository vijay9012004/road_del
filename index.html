<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Road Anomaly Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>🚦 Road Anomaly Detection using CNN</h1>

<div class="section">
    <h2>Live Camera Detection</h2>
    <img src="/video_feed" class="video-box">
</div>

<div class="section">
    <h2>Upload Image</h2>

    <form id="uploadForm">
        <input type="file" name="image" required>
        <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
</div>

<script>
document.getElementById("uploadForm").onsubmit = async (e) => {
    e.preventDefault();

    let formData = new FormData(e.target);

    let response = await fetch("/predict_image", {
        method: "POST",
        body: formData
    });

    let data = await response.json();

    document.getElementById("result").innerHTML = `
        <p><b>Prediction:</b> ${data.class}</p>
        <p><b>Confidence:</b> ${(data.confidence * 100).toFixed(2)}%</p>
        <p><b>Emergency:</b> ${data.emergency}</p>
    `;
};
</script>

</body>
</html>
