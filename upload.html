<!DOCTYPE html>
<html>
<head>
<style>
.plus-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: #4CAF50;
  color: white;
  font-size: 32px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plus-btn:hover {
  background-color: #43a047;
}

#fileInput {
  display: none;
}
</style>
</head>

<body>

<button class="plus-btn" onclick="openUpload()">+</button>

<input
  type="file"
  id="fileInput"
  accept="image/*,video/*"
  onchange="fileSelected(event)"
>

<script>
function openUpload() {
  document.getElementById("fileInput").click();
}

function fileSelected(event) {
  const file = event.target.files[0];
  if (file) {
    alert("Selected: " + file.name);
    // Send file to backend using fetch()
  }
}
</script>

</body>
</html>
